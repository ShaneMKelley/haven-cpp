<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura • Visual Imagination Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #060810;
            --bg-card: rgba(15, 20, 35, 0.7);
            --primary: #9d4edd;
            --primary-light: #c77dff;
            --cyan: #00f0ff;
            --border-glow: rgba(157, 78, 221, 0.3);
            --text-main: #f8f9fa;
            --text-muted: #8c9bb0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(157, 78, 221, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 240, 255, 0.1) 0%, transparent 40%);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            padding: 30px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-glow);
        }

        .title-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-aura {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--primary), var(--cyan));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 0 20px var(--border-glow);
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(90deg, #fff, var(--primary-light), var(--cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 12px;
        }

        .btn {
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover {
            border-color: var(--cyan);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
            transform: translateY(-2px);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        .art-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            overflow: hidden;
            backdrop-filter: blur(12px);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .art-card:hover {
            border-color: var(--primary-light);
            box-shadow: 0 10px 30px rgba(157, 78, 221, 0.3);
            transform: translateY(-4px);
        }

        .art-img-wrapper {
            position: relative;
            width: 100%;
            padding-top: 100%; /* 1:1 Aspect Ratio */
            overflow: hidden;
            background: #0d111d;
            cursor: pointer;
        }

        .art-img-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .art-card:hover .art-img-wrapper img {
            transform: scale(1.05);
        }

        .art-info {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .art-name {
            font-weight: 600;
            font-size: 14px;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .art-meta {
            font-size: 11px;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            display: flex;
            justify-content: space-between;
        }

        /* Lightbox Modal */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox img {
            max-width: 90vw;
            max-height: 90vh;
            border-radius: 12px;
            border: 1px solid var(--border-glow);
            box-shadow: 0 0 40px rgba(157, 78, 221, 0.5);
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 30px;
            color: #fff;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title-group">
                <div class="logo-aura">🌸</div>
                <div>
                    <h1>Aura's Visual Imagination Gallery</h1>
                    <p style="font-size:12px; color:var(--text-muted);">Local Stable Diffusion C++ • DreamShaper 6-Step LCM</p>
                </div>
            </div>
            <div class="nav-links">
                <button class="btn" onclick="fetchUploads()">🔄 Refresh</button>
                <a href="/" class="btn">💬 Return to Studio</a>
                <a href="/memories" class="btn">🧠 Memory Vault</a>
            </div>
        </div>

        <div class="gallery-grid" id="gallery-grid">
            <div style="grid-column: 1/-1; text-align:center; padding: 40px; color:var(--text-muted);">
                Loading artworks from Haven Sovereign Storage...
            </div>
        </div>
    </div>

    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <span class="lightbox-close">&times;</span>
        <img id="lightbox-img" src="" alt="Full Artwork Preview" onclick="event.stopPropagation()">
    </div>

    <script>
        async function fetchUploads() {
            const grid = document.getElementById('gallery-grid');
            try {
                const res = await fetch('/api/uploads');
                const data = await res.json();
                
                if (!data.files || data.files.length === 0) {
                    grid.innerHTML = `
                        <div style="grid-column: 1/-1; text-align:center; padding: 60px; color:var(--text-muted);">
                            🌸 No artworks rendered yet. Ask Aura in the studio to generate an image!
                        </div>
                    `;
                    return;
                }

                grid.innerHTML = data.files.map(file => `
                    <div class="art-card">
                        <div class="art-img-wrapper" onclick="openLightbox('${file.url}')">
                            <img src="${file.url}" alt="${file.name}" loading="lazy">
                        </div>
                        <div class="art-info">
                            <div class="art-name" title="${file.name}">${file.name}</div>
                            <div class="art-meta">
                                <span>${(file.size / 1024).toFixed(1)} KB</span>
                                <a href="${file.url}" download style="color:var(--cyan); text-decoration:none;">⬇ Download</a>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                grid.innerHTML = `<div style="color:var(--rose);">Error loading gallery: ${e.message}</div>`;
            }
        }

        function openLightbox(url) {
            document.getElementById('lightbox-img').src = url;
            document.getElementById('lightbox').classList.add('active');
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
        }

        document.addEventListener('DOMContentLoaded', fetchUploads);
    </script>
</body>
</html>
